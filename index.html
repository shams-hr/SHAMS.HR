<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريق شمس التطوعي - نظام إدارة وأرشيف العقود</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#07152f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="فريق شمس">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/MczxSRC6/a373f6e8-e93b-40df-a2b5-83c8caf5c7bb.png">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* =====================================================
            الهوية الأساسية
            ===================================================== */

        :root {
            --primary-orange: #f5a623;
            --primary-orange-dark: #d88908;
            --dark-navy: #07152f;
            --dark-navy-2: #0d2347;
            --bg-body: #f5f7fb;
            --card-bg: #ffffff;
            --text-dark: #172033;
            --text-muted: #718096;
            --border: #e5e9f0;
            --success: #16a34a;
            --danger: #dc3545;

            --shadow-sm: 0 3px 12px rgba(7, 21, 47, 0.06);
            --shadow-md: 0 10px 30px rgba(7, 21, 47, 0.09);
            --shadow-lg: 0 20px 50px rgba(7, 21, 47, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at 10% 10%, rgba(245,166,35,0.06), transparent 25%),
                radial-gradient(circle at 90% 90%, rgba(7,21,47,0.04), transparent 25%),
                var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* =====================================================
            Scrollbar
            ===================================================== */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #eef1f6;
        }

        ::-webkit-scrollbar-thumb {
            background: #b9c1cf;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-orange);
        }

        /* =====================================================
            شاشة تسجيل الدخول
            ===================================================== */

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    rgba(7,21,47,0.98),
                    rgba(13,35,71,0.97)
                );

            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .auth-overlay::before,
        .auth-overlay::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .auth-overlay::before {
            width: 450px;
            height: 450px;
            background: rgba(245,166,35,0.06);
            top: -180px;
            right: -120px;
        }

        .auth-overlay::after {
            width: 550px;
            height: 550px;
            border: 1px solid rgba(245,166,35,0.08);
            bottom: -300px;
            left: -150px;
        }

        .auth-card {
            position: relative;
            z-index: 2;

            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 24px;

            padding: 42px 35px 35px;

            width: 100%;
            max-width: 430px;

            box-shadow: var(--shadow-lg);

            text-align: center;

            animation: loginCardIn 0.55s ease;
        }

        .auth-card::before {
            content: "";
            position: absolute;

            top: 0;
            right: 12%;
            left: 12%;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--primary-orange),
                    transparent
                );

            border-radius: 0 0 20px 20px;
        }

        .auth-card img {
            filter: drop-shadow(0 5px 12px rgba(245,166,35,0.2));
            transition: transform 0.3s ease;
        }

        .auth-card img:hover {
            transform: scale(1.04);
        }

        .auth-card h2 {
            color: var(--dark-navy);
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.3px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .auth-card .form-control {
            height: 50px;
            background: #f8fafc;
            border: 1px solid #e1e6ee;
            border-radius: 11px;
            padding: 0 15px;
            transition: all 0.25s ease;
        }

        .auth-card .form-control:focus {
            background: white;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(245,166,35,0.12);
            transform: translateY(-1px);
        }

        .auth-card .btn-orange {
            height: 50px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary-orange),
                    #ffbd42
                );

            box-shadow:
                0 7px 18px rgba(245,166,35,0.25);
        }

        .auth-card .btn-orange:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 24px rgba(245,166,35,0.32);
        }

        /* =====================================================
            شريط التنقل العلوي
            ===================================================== */

        .top-navbar {
            background:
                linear-gradient(
                    135deg,
                    var(--dark-navy),
                    var(--dark-navy-2)
                );

            min-height: 76px;

            padding: 12px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 6px 22px rgba(7,21,47,0.16);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .top-navbar > div:first-child {
            display: flex;
            align-items: center;
            gap: 12px;

            white-space: nowrap;

            font-weight: 900;
            font-size: 18px;
            color: #ffffff; /* تم تغيير لون النص إلى الأبيض */
        }

        .top-navbar > div:first-child img.nav-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(245,166,35,0.3));
        }

        /* =====================================================
            القوائم
            ===================================================== */

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .nav-links button {
            background: transparent;

            border: 1px solid transparent;

            color: rgba(255,255,255,0.78);

            font-size: 13px;
            font-weight: 700;

            margin-left: 0;

            padding: 10px 13px;

            border-radius: 9px;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .nav-links button i {
            margin-left: 5px;
            color: rgba(255,255,255,0.6);
        }

        .nav-links button:hover {
            color: white;

            background:
                rgba(255,255,255,0.08);

            border-color:
                rgba(255,255,255,0.08);

            transform: translateY(-1px);
        }

        .nav-links button.active {
            color: var(--dark-navy);

            background:
                linear-gradient(
                    135deg,
                    var(--primary-orange),
                    #ffc34d
                );

            box-shadow:
                0 5px 14px rgba(245,166,35,0.22);
        }

        .nav-links button.active i {
            color: var(--dark-navy);
        }

        .top-navbar > button {
            border-radius: 9px !important;

            background:
                rgba(255,255,255,0.09) !important;

            border:
                1px solid rgba(255,255,255,0.12) !important;

            transition: all 0.25s ease;
        }

        .top-navbar > button:hover {
            background: #ef4444 !important;
            transform: translateY(-1px);
        }

        /* =====================================================
            المحتوى الرئيسي
            ===================================================== */

        .main-container {
            max-width: 1200px;

            margin: 34px auto;

            padding: 0 24px;

            position: relative;
            z-index: 5;
        }

        /* =====================================================
            الكروت
            ===================================================== */

        .card-box {
            position: relative;

            background: rgba(255,255,255,0.98);

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 28px;

            box-shadow: var(--shadow-sm);

            margin-bottom: 24px;

            transition:
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        .card-box:hover {
            box-shadow: var(--shadow-md);
        }

        .card-box h3 {
            position: relative;

            color: var(--dark-navy);

            border-bottom: none !important;

            padding-bottom: 15px !important;

            margin-bottom: 22px !important;

            font-size: 19px;

            display: flex;
            align-items: center;

            gap: 9px;
        }

        .card-box h3::after {
            content: "";

            position: absolute;

            bottom: 0;
            right: 0;

            width: 48px;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--primary-orange),
                    #ffd16c
                );

            border-radius: 10px;
        }

        .card-box h3 i {
            color: var(--primary-orange);
        }

        /* =====================================================
            النماذج
            ===================================================== */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 18px;

            margin-bottom: 20px;
        }

        .form-group {
            text-align: right;
        }

        .form-group label {
            display: block;

            color: #26334d;

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;

            height: 46px;

            background: #f9fafc;

            border: 1px solid #dfe4ec;

            border-radius: 10px;

            padding: 10px 13px;

            color: var(--text-dark);

            outline: none;

            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: #a3acba;
        }

        .form-control:hover {
            border-color: #c7ced9;
        }

        .form-control:focus {
            background: #fff;

            border-color: var(--primary-orange);

            box-shadow:
                0 0 0 4px rgba(245,166,35,0.10);
        }

        select.form-control {
            cursor: pointer;
        }

        /* =====================================================
            الأزرار
            ===================================================== */

        .btn-action {
            min-height: 43px;

            border-radius: 9px;

            padding: 9px 17px;

            font-size: 13px;

            font-weight: 800;

            border: none;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .btn-orange {
            background:
                linear-gradient(
                    135deg,
                    var(--primary-orange),
                    #ffbd43
                );

            color: white;

            box-shadow:
                0 5px 14px rgba(245,166,35,0.18);
        }

        .btn-orange:hover {
            box-shadow:
                0 8px 20px rgba(245,166,35,0.28);
        }

        .btn-navy {
            background:
                linear-gradient(
                    135deg,
                    var(--dark-navy),
                    var(--dark-navy-2)
                );

            color: white;
        }

        .btn-green {
            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #18c78d
                );

            color: white;
        }

        .btn-danger {
            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #f05252
                );

            color: white;
        }

        .btn-blue {
            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #5b9bf8
                );

            color: white;
        }

        .btn-purple {
            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #9b72f7
                );

            color: white;
        }

        /* =====================================================
            الجداول
            ===================================================== */

        table {
            width: 100%;

            border-collapse: separate;

            border-spacing: 0;

            overflow: hidden;

            border:
                1px solid var(--border);

            border-radius: 13px;

            background: white;

            margin-top: 15px;
        }

        th,
        td {
            padding: 14px 13px;

            text-align: right;

            border-bottom:
                1px solid #edf0f4;

            white-space: nowrap;
        }

        th {
            background: #f7f9fc;

            color: var(--dark-navy);

            font-size: 12px;

            font-weight: 800;

            border-bottom:
                1px solid #e4e8ef;
        }

        td {
            color: #455166;

            font-size: 12px;
        }

        tbody tr {
            transition:
                background 0.2s ease;
        }

        tbody tr:hover {
            background: #fffaf0;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td b {
            color: var(--dark-navy);
        }

        #archiveTab .card-box,
        #usersTab .card-box {
            overflow-x: auto;
        }

        /* =====================================================
            الحالات
            ===================================================== */

        .badge {
            padding: 5px 9px;

            border-radius: 7px;

            font-size: 10px;

            font-weight: 800;

            display: inline-block;

            white-space: nowrap;
        }

        .badge-active {
            background: #e8f8ee;

            color: #14803d;

            border:
                1px solid #c8efd6;
        }

        .badge-warning {
            background: #fff7db;

            color: #a16207;

            border:
                1px solid #f7e6a8;
        }

        .badge-expired {
            background: #fff0f0;

            color: #b4232f;

            border:
                1px solid #ffd2d5;
        }

        /* =====================================================
            معاينة العقد
            ===================================================== */

        .contract-paper {
            background: white;

            width: 794px;

            min-height: 1120px;

            padding: 25px 40px;

            margin: 0 auto;

            border-radius: 4px;

            border:
                1px solid #e1e5eb;

            box-shadow:
                0 15px 45px rgba(7,21,47,0.10),
                0 2px 6px rgba(7,21,47,0.04);

            position: relative;

            box-sizing: border-box;

            overflow: hidden;
        }

        .contract-paper::before {
            content: "";

            position: absolute;

            top: 0;
            right: 0;

            width: 100%;
            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    var(--dark-navy),
                    var(--primary-orange),
                    var(--dark-navy)
                );
        }

        .contract-title {
            text-align: center;

            font-size: 18px;

            font-weight: 900;

            color: var(--dark-navy);

            margin: 5px 0 10px 0;
        }

        .contract-row {
            font-size: 11.5px;

            line-height: 1.45;

            font-weight: 600;

            color: #111;

            margin-bottom: 2px;
        }

        .fill-val {
            border-bottom:
                1px dashed var(--primary-orange);

            padding: 0 5px;

            font-weight: 800;

            color: var(--dark-navy);

            display: inline-block;
        }

        .section-h {
            font-size: 12px;

            font-weight: 900;

            color: var(--dark-navy);

            margin: 8px 0 2px 0;

            border-right:
                3px solid var(--primary-orange);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(245,166,35,0.06)
                );

            padding: 4px 8px;

            border-radius: 3px;
        }

        .contract-ul {
            list-style: none;

            padding-right: 0;
        }

        .contract-ul li {
            font-size: 11px;

            line-height: 1.35;

            color: #222;

            font-weight: 500;

            margin-bottom: 1px;
        }

        /* =====================================================
            التوقيعات
            ===================================================== */

        .sig-grid {
            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            margin-top: 15px;

            padding-top: 10px;

            border-top:
                1px solid #e4e8ee;
        }

        .sig-box {
            text-align: center;

            flex: 1;

            padding: 0 5px;
        }

        .sig-box .title {
            color: #000;

            font-size: 10.5px;

            font-weight: 800;

            margin-bottom: 3px;
        }

        .sig-line {
            border-bottom:
                1px dashed #777;

            width: 85%;

            margin: 0 auto;
        }

        .sig-img {
            height: 38px;

            object-fit: contain;

            display: block;

            margin: 0 auto 2px auto;
        }

        /* =====================================================
            Username / Password
            ===================================================== */

        code {
            background: #f1f4f8;

            border:
                1px solid #e3e7ed;

            padding: 4px 7px;

            border-radius: 6px;

            color: var(--dark-navy);

            font-family: monospace;
        }

        /* =====================================================
            رفع الملفات
            ===================================================== */

        input[type="file"] {
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            border: none;

            background:
                var(--dark-navy);

            color: white;

            padding: 8px 12px;

            border-radius: 7px;

            margin-left: 10px;

            cursor: pointer;

            font-family: 'Tajawal', sans-serif;

            font-weight: 700;
        }

        /* =====================================================
            Animations
            ===================================================== */

        @keyframes loginCardIn {
            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes fadeInContent {
            from {
                opacity: 0;

                transform:
                    translateY(8px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        #createTab,
        #uploadTab,
        #archiveTab,
        #usersTab {
            animation:
                fadeInContent 0.3s ease;
        }

        /* =====================================================
            الجوال
            ===================================================== */

        @media (max-width: 900px) {

            .top-navbar {
                padding: 12px 15px;

                flex-wrap: wrap;

                gap: 12px;
            }

            .top-navbar > div:first-child {
                width: 100%;

                justify-content: center;
            }

            .nav-links {
                width: 100%;

                order: 3;

                overflow-x: auto;

                justify-content: flex-start;

                flex-wrap: nowrap;

                padding-bottom: 3px;
            }

            .nav-links button {
                flex: 0 0 auto;

                font-size: 12px;

                padding: 9px 11px;
            }

            .top-navbar > button {
                position: absolute;

                left: 15px;

                top: 12px;
            }

            .main-container {
                margin: 20px auto;

                padding: 0 12px;
            }

            .card-box {
                padding: 20px 16px;

                border-radius: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group[style*="grid-column"] {
                grid-column: auto !important;
            }

            .contract-paper {
                margin-right: 0;

                margin-left: 0;
            }
        }

        @media (max-width: 600px) {

            .auth-card {
                padding: 32px 22px 25px;

                border-radius: 20px;
            }

            .auth-card h2 {
                font-size: 21px;
            }

            .top-navbar {
                min-height: auto;
            }

            .top-navbar > div:first-child {
                font-size: 16px !important;
            }

            .top-navbar > button {
                font-size: 0;

                width: 38px;

                height: 38px;

                padding: 0 !important;

                justify-content: center;
            }

            .top-navbar > button i {
                font-size: 14px;
            }

            .card-box h3 {
                font-size: 16px;
            }

            .btn-action {
                width: 100%;

                justify-content: center;
            }

            .card-box > form .btn-action {
                width: 100%;
            }

            table {
                min-width: 900px;
            }
        }

        /* =====================================================
            الطباعة
            ===================================================== */

        @media print {

            .auth-overlay,
            .top-navbar,
            .card-box,
            .btn-action,
            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
            }

            .main-container {
                max-width: 100% !important;

                margin: 0 !important;

                padding: 0 !important;
            }

            .contract-paper {
                box-shadow: none !important;

                border: none !important;

                border-radius: 0 !important;

                margin: 0 !important;

                width: 100% !important;
            }

            .contract-paper::before {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         شاشة تسجيل الدخول
         ===================================================== -->

    <div class="auth-overlay" id="authSection">

        <div class="auth-card">

            <img
                src="https://i.postimg.cc/MczxSRC6/a373f6e8-e93b-40df-a2b5-83c8caf5c7bb.png" 
                alt="شعار الفريق" 
                width="90" 
                height="90" 
                style="margin-bottom: 10px;"
            >
            <h2>تسجيل الدخول</h2>
            <p>نظام إدارة وأرشيف العقود - فريق شمس التطوعي</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="text" id="loginUser" class="form-control" placeholder="اسم المستخدم" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="password" id="loginPass" class="form-control" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn-action btn-orange" style="width: 100%;">دخول للنظام</button>
            </form>
        </div>

    </div>

    <!-- =====================================================
         شريط التنقل العلوي
         ===================================================== -->

    <header class="top-navbar">
        <div>
