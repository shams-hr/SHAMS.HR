name: إرسال شهادات الخبرة تلقائياً

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  send-certificates:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت المتطلبات
        run: |
          npm install firebase-admin resend puppeteer

      - name: تشغيل إرسال الشهادات
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node send-certificates.js
